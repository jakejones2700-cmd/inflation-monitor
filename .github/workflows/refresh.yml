name: Refresh inflation data
on:
  schedule:
    - cron: '25 16 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve CPI and PCE data
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: python update_data.py
      - name: Commit new observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dashboard.json
          git diff --cached --quiet || (git commit -m 'Refresh CPI and PCE data' && git push)
